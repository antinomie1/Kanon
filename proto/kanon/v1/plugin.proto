syntax = "proto3";

package kanon.plugin.v1;

import "google/protobuf/struct.proto";

// 1. 插件宿主生命周期服务 (运行在 Host 端)
service PluginHostService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc ReloadPluginConfig (ReloadPluginConfigRequest) returns (ReloadPluginConfigResponse);
  rpc GetPluginMeta (GetPluginMetaRequest) returns (GetPluginMetaResponse);
  // Management action invoked by the control plane.
  //
  // Actions are the console counterpart of tools: credential binding, QR login and diagnostics
  // are operations an operator triggers, not functions the model may call. Adapter plugins must
  // expose such operations here so that their tool list stays empty — an adapter's tools would
  // otherwise be offered to the LLM, which then tries to bind credentials mid-conversation.
  rpc InvokeAction (PluginActionRequest) returns (PluginActionResponse);
}

// --- 控制台管理动作 ---

message PluginActionRequest {
  string plugin_id = 1;
  // Action name declared by the plugin, e.g. "qq_request_login_qr".
  string action = 2;
  google.protobuf.Struct parameters = 3;
}

message PluginActionResponse {
  bool success = 1;
  string error_message = 2;
  google.protobuf.Struct result = 3;
}

// 2. 消息与事件管道服务 (运行在 Host 端，Core 主动连接各 Host 端点发起调用)
service MessagePipelineService {
  rpc OnPreFilter (PipelineEventRequest) returns (PreFilterResult);
  rpc OnExecuteCommand (CommandExecuteRequest) returns (CommandExecuteResponse);
  rpc OnCallTool (ToolCallRequest) returns (ToolCallResponse);
  // Fire-and-forget lifecycle events, sent only for the kinds a plugin lists in `PluginMeta.events`.
  rpc OnEvent (EventNotification) returns (EventAck);
  rpc OnDeliverMessage (DeliverMessageRequest) returns (DeliverMessageResponse);
  // Rewrites a reply before it is delivered; called only for plugins with
  // `PluginMeta.decorates_replies`, in host priority order, each seeing the previous result.
  rpc OnDecorateReply (DecorateReplyRequest) returns (DecorateReplyResult);
}

// 3. 核心 API 服务 (运行在 Core 端，监听 core.sock / loopback，Host 主动连接调用)
service BotApiService {
  rpc RegisterHost (RegisterHostRequest) returns (RegisterHostResponse);
  rpc IngestEvent (IngestEventRequest) returns (IngestEventResponse);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  // Reply to an original platform event through the same outbound FIFO. Success
  // means the platform adapter accepted delivery, not merely queue admission.
  // A deadline/disconnect is an unknown outcome and must not trigger an automatic retry.
  rpc ReplyMessage (DeliverMessageRequest) returns (DeliverMessageResponse);
  rpc RequestLLM (LLMRequest) returns (stream LLMChunk);
  rpc SetStorage (SetStorageRequest) returns (SetStorageResponse);
  rpc GetStorage (GetStorageRequest) returns (GetStorageResponse);
  // Liveness probe answered by the core itself, without touching the pipeline.
  //
  // Hosts use it to notice that the core they registered with has exited: a host whose core is
  // gone must stop, otherwise it keeps serving its platform (and, for adapters, keeps the
  // platform's long-lived connection) while no bot instance can answer — which shows up as a
  // ghost bot double-handling messages.
  rpc Ping (PingRequest) returns (PingResponse);
}

// --- 握手与注册 ---

message RegisterHostRequest {
  string host_id = 1;
  string runtime = 2; // "rust", "python", "typescript"
  string endpoint = 3; // Host 监听的专属 socket 路径或 loopback 地址
  repeated string loaded_plugin_ids = 4;
}

message RegisterHostResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Struct core_metadata = 3;
}

message PingRequest {
  int64 timestamp = 1;
}

message PingResponse {
  int64 timestamp = 1;
}

message ReloadPluginConfigRequest {
  string plugin_id = 1;
  google.protobuf.Struct config = 2;
  uint64 version = 3;
}

message ReloadPluginConfigResponse {
  bool success = 1;
  string error_message = 2;
  uint64 applied_version = 3;
}

message GetPluginMetaRequest {}

// Who may run a command (or fire a trigger) when the operator's command policy does not name it.
//
// The operator's policy always wins; this is only the plugin's default, so a plugin can declare
// that a destructive command is for administrators without the operator having to know about it.
enum CommandAccess {
  COMMAND_ACCESS_EVERYONE = 0;
  // Anyone in a private chat; only administrators in groups and channels.
  COMMAND_ACCESS_ADMINS_IN_GROUPS = 1;
  COMMAND_ACCESS_ADMINS = 2;
}

message CommandMeta {
  string name = 1;
  string description = 2;
  string usage = 3;
  int32 priority = 4;
  // Alternative names routed to the same handler; the handler always receives `name`.
  repeated string aliases = 5;
  CommandAccess access = 6;
}

// A message pattern that runs a plugin handler without a slash command.
//
// Triggers are matched after slash commands and before the reply policy and the model, against
// the message text with leading @-mentions removed. The first matching trigger (lowest priority
// value) handles the message through OnExecuteCommand: `command` is the trigger name, `args` are
// the capture groups (an unmatched group is an empty string) and `raw_args` is the whole text.
// A trigger the sender may not fire is skipped silently, since nobody typed a command.
message TriggerMeta {
  string name = 1;
  string description = 2;
  // Regular expression in Rust `regex` syntax; an invalid pattern never matches and is logged.
  string pattern = 3;
  int32 priority = 4;
  CommandAccess access = 5;
}

message ToolMeta {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
}

message PluginMeta {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string description = 5;
  repeated CommandMeta commands = 6;
  repeated ToolMeta tools = 7;
  repeated TriggerMeta triggers = 8;
  // Lifecycle events this plugin wants through `OnEvent`; nothing is sent for unlisted kinds.
  repeated EventKind events = 9;
  // Whether `OnDecorateReply` should be called for this plugin.
  bool decorates_replies = 10;
}

message GetPluginMetaResponse {
  repeated PluginMeta plugins = 1;
}

// --- 强类型消息段定义 (彻底废弃 map<string, string> 反模式) ---

message PipelineEventRequest {
  string event_id = 1;
  string platform = 2;
  string channel_id = 3;
  string sender_id = 4;
  string raw_text = 5;
  repeated MessageSegment segments = 6;
  google.protobuf.Struct metadata = 7;
}

message MessageSegment {
  oneof segment {
    TextSegment text = 1;
    ImageSegment image = 2;
    AudioSegment audio = 3;
    MentionSegment mention = 4;
    ReplySegment reply = 5;
    RawCustomSegment custom = 6;
  }
}

message TextSegment {
  string content = 1;
}

message ImageSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  optional string mime_type = 4;
  optional string filename = 5;
}

message AudioSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  optional int32 duration_seconds = 4;
}

message MentionSegment {
  string target_user_id = 1;
  string display_name = 2;
  bool is_all = 3;
}

message ReplySegment {
  string target_message_id = 1;
  string snippet = 2;
}

message RawCustomSegment {
  string type_name = 1;
  google.protobuf.Struct payload = 2;
}

// --- 流水线与指令定义 ---

message PreFilterResult {
  enum Action {
    PASS = 0;
    BLOCK = 1;
    MODIFY = 2;
  }
  Action action = 1;
  string modified_text = 2;
  repeated MessageSegment reply_messages = 3;
}

message CommandExecuteRequest {
  string plugin_id = 1;
  // Canonical command name (never an alias), or the trigger name.
  string command = 2;
  // Arguments split on whitespace; quoted text ("a b", 'a b', “a b”) stays one argument.
  repeated string args = 3;
  PipelineEventRequest context = 4;
  // Everything after the command name, unsplit, for handlers that parse their own syntax.
  string raw_args = 5;
  // Set when this is the sender's next message, routed here because the previous response for
  // `command` asked to capture the conversation. `args` and `raw_args` then hold the whole
  // message text (leading @-mentions removed) and `context` the new event.
  bool continuation = 6;
}

message CommandExecuteResponse {
  bool success = 1;
  repeated MessageSegment replies = 2;
  string error_message = 3;
  // When non-zero, the next message from the same sender in the same channel (within this many
  // seconds, at most 600) skips commands, triggers and the model and is delivered to this plugin
  // as a continuation of `command`. One capture covers one message; answer a continuation with
  // `capture_seconds` again to keep the conversation. Pre-filters still see the message first.
  uint32 capture_seconds = 4;
}

// --- Tool Calling 双模载荷定义 (彻底消灭 JSON 字符串二次序列化) ---

message ToolCallRequest {
  string call_id = 1;
  string tool_name = 2;
  string session_id = 3;
  oneof payload {
    google.protobuf.Struct structured_args = 4;
    bytes raw_bytes = 5;
  }
  // The inbound event whose conversation turn invoked the tool: who asked, where, on which
  // platform. Absent when the model runs outside a platform conversation (the console chat).
  PipelineEventRequest context = 6;
}

message ToolCallResponse {
  string call_id = 1;
  bool success = 2;
  string error_message = 3;
  oneof payload {
    google.protobuf.Struct structured_result = 4;
    bytes raw_bytes = 5;
  }
  // Rich media produced by the tool (images, files). The core forwards these to the outbound
  // message as attachments, so a tool that draws a picture is not reduced to a text description.
  repeated ToolAttachment attachments = 6;
}

// One attachment produced by a tool call.
message ToolAttachment {
  // MIME type of the payload, e.g. `image/png`.
  string mime_type = 1;
  // Absolute path of a file the core wrote the bytes to.
  optional string file_path = 2;
  // Remote URL, when the tool referenced one instead of embedding bytes.
  optional string url = 3;
}

// Lifecycle events a plugin can subscribe to.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // The bot delivered a message (any source: model, command, plugin `SendMessage`).
  EVENT_KIND_MESSAGE_SENT = 1;
  // A platform notice (join, poke, recall, friend request, ...) arrived.
  EVENT_KIND_NOTICE = 2;
  // The model answered a conversational message.
  EVENT_KIND_LLM_RESPONSE = 3;
}

// One lifecycle event, addressed to one subscribing plugin. The set `detail` is the event kind.
message EventNotification {
  reserved 1, 2;
  reserved "event_type", "payload";
  string plugin_id = 3;
  oneof detail {
    MessageSentEvent message_sent = 4;
    // The notice exactly as the adapter reported it (kind in `metadata`, see `META_NOTICE`).
    PipelineEventRequest notice = 5;
    LlmResponseEvent llm_response = 6;
  }
}

message MessageSentEvent {
  DeliverMessageRequest message = 1;
  // Platform message id reported by the adapter, empty when it reports none.
  string message_id = 2;
}

message LlmResponseEvent {
  // The message the model answered.
  PipelineEventRequest context = 1;
  // The model's final text, before reply decoration.
  string content = 2;
}

// Where a decorated reply came from.
enum ReplySource {
  REPLY_SOURCE_UNSPECIFIED = 0;
  REPLY_SOURCE_LLM = 1;
  REPLY_SOURCE_COMMAND = 2;
}

message DecorateReplyRequest {
  string plugin_id = 1;
  // The inbound message being answered.
  PipelineEventRequest context = 2;
  repeated MessageSegment segments = 3;
  ReplySource source = 4;
  // Command or trigger name for `REPLY_SOURCE_COMMAND`, empty otherwise.
  string command = 5;
}

message DecorateReplyResult {
  // When false the reply is left untouched and `segments` is ignored. When true `segments`
  // replaces the reply; an empty list suppresses it.
  bool modified = 1;
  repeated MessageSegment segments = 2;
}

message EventAck {
  bool received = 1;
}

message DeliverMessageRequest {
  string platform = 1;
  string channel_id = 2;
  string recipient_id = 3;
  repeated MessageSegment segments = 4;
  string event_id = 5;
}

message DeliverMessageResponse {
  bool success = 1;
  string message_id = 2;
  string error_message = 3;
}

message IngestEventRequest {
  string platform = 1;
  PipelineEventRequest event = 2;
}

message IngestEventResponse {
  bool accepted = 1;
  string event_id = 2;
}

message SendMessageRequest {
  string platform = 1;
  string channel_id = 2;
  string recipient_id = 3;
  repeated MessageSegment segments = 4;
}

message SendMessageResponse {
  // Whether the outbound message was accepted into the outbound dispatch queue.
  // Delivery to the external platform is asynchronous and subject to platform breakers and DLQ.
  bool success = 1;
  // Internal tracking ID assigned to this queued outbound message.
  string message_id = 2;
  // Rejection explanation if queue admission failed.
  string error_message = 3;
  // Explicit admission flag confirming the message is queued for outbound dispatch.
  bool accepted = 4;
}

message LLMRequest {
  string prompt = 1;
  string model = 2;
  google.protobuf.Struct parameters = 3;
}

message LLMChunk {
  string delta_text = 1;
  bool is_finished = 2;
}

message SetStorageRequest {
  string plugin_id = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_seconds = 4;
}

message SetStorageResponse {
  bool success = 1;
}

message GetStorageRequest {
  string plugin_id = 1;
  string key = 2;
}

message GetStorageResponse {
  bool found = 1;
  bytes value = 2;
}

syntax = "proto3";

package kanon.plugin.v1;

import "google/protobuf/struct.proto";

// 1. 插件宿主生命周期服务 (运行在 Host 端)
service PluginHostService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc ReloadPluginConfig (ReloadPluginConfigRequest) returns (ReloadPluginConfigResponse);
  rpc GetPluginMeta (GetPluginMetaRequest) returns (GetPluginMetaResponse);
  // Management action invoked by the control plane.
  //
  // Actions are the console counterpart of tools: credential binding, QR login and diagnostics
  // are operations an operator triggers, not functions the model may call. Adapter plugins must
  // expose such operations here so that their tool list stays empty — an adapter's tools would
  // otherwise be offered to the LLM, which then tries to bind credentials mid-conversation.
  rpc InvokeAction (PluginActionRequest) returns (PluginActionResponse);
}

// --- 控制台管理动作 ---

message PluginActionRequest {
  string plugin_id = 1;
  // Action name declared by the plugin, e.g. "qq_request_login_qr".
  string action = 2;
  google.protobuf.Struct parameters = 3;
}

message PluginActionResponse {
  bool success = 1;
  string error_message = 2;
  google.protobuf.Struct result = 3;
}

// 2. 消息与事件管道服务 (运行在 Host 端，Core 主动连接各 Host 端点发起调用)
service MessagePipelineService {
  rpc OnPreFilter (PipelineEventRequest) returns (PreFilterResult);
  rpc OnExecuteCommand (CommandExecuteRequest) returns (CommandExecuteResponse);
  rpc OnCallTool (ToolCallRequest) returns (ToolCallResponse);
  // Fire-and-forget lifecycle events, sent only for the kinds a plugin lists in `PluginMeta.events`.
  rpc OnEvent (EventNotification) returns (EventAck);
  rpc OnDeliverMessage (DeliverMessageRequest) returns (DeliverMessageResponse);
  // Rewrites a reply before it is delivered; called only for plugins with
  // `PluginMeta.decorates_replies`, in host priority order, each seeing the previous result.
  rpc OnDecorateReply (DecorateReplyRequest) returns (DecorateReplyResult);
  // Adds plugin context to the current turn just before the model answers it; called only for
  // plugins with `PluginMeta.prepares_turns`. The text is prepended to the current user message,
  // never to the system prompt or the history, so the cached request prefix stays stable.
  rpc OnPrepareTurn (PrepareTurnRequest) returns (PrepareTurnResult);
  // Rewrites the system prompt of a model conversation; called only for plugins with
  // `PluginMeta.rewrites_system_prompt`, in host priority order, each seeing the previous result.
  // Called once per turn before the first model request (the result is reused for the turn's
  // tool rounds and its compaction), and never for a plugin's own `RequestLLM`/`RunAgent` calls
  // unless they run inside the conversation.
  //
  // The system prompt is the first thing in every request, so its bytes decide the provider's
  // prompt cache: a rewrite must be deterministic for a given conversation (no clocks, counters
  // or per-message data — those belong in `OnPrepareTurn`). A failing or slow plugin (deadline
  // as `OnPrepareTurn`) leaves the prompt as it was.
  rpc OnLlmRequest (LlmRequestHookRequest) returns (LlmRequestHookResult);
  // Serves an HTTP request addressed to the plugin's web routes; called only for plugins with
  // `PluginMeta.serves_http`. The management gateway forwards
  // `/api/v1/plugins/<plugin_id>/http/<path>` here; the plugin routes on `path` itself.
  rpc OnHttpRequest (HttpRequest) returns (HttpResponse);
}

// 3. 核心 API 服务 (运行在 Core 端，监听 core.sock / loopback，Host 主动连接调用)
service BotApiService {
  rpc RegisterHost (RegisterHostRequest) returns (RegisterHostResponse);
  rpc IngestEvent (IngestEventRequest) returns (IngestEventResponse);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  // Reply to an original platform event through the same outbound FIFO. Success
  // means the platform adapter accepted delivery, not merely queue admission.
  // A deadline/disconnect is an unknown outcome and must not trigger an automatic retry.
  rpc ReplyMessage (DeliverMessageRequest) returns (DeliverMessageResponse);
  rpc RequestLLM (LLMRequest) returns (stream LLMChunk);
  // Calls one action of a built-in adapter's platform API (OneBot action, Milky endpoint) and
  // returns its result. Errors are gRPC statuses: NOT_FOUND for an unknown platform,
  // UNIMPLEMENTED when the adapter offers no API, INVALID_ARGUMENT for a malformed action,
  // UNAVAILABLE when the platform rejected or could not take the call.
  rpc CallPlatformApi (PlatformApiRequest) returns (PlatformApiResponse);
  // Central key-value store, one namespace per plugin, persisted by the core in `data/kv.db`.
  // Values are opaque bytes (the SDKs store JSON). A key that expired reads as absent.
  rpc SetStorage (SetStorageRequest) returns (SetStorageResponse);
  rpc GetStorage (GetStorageRequest) returns (GetStorageResponse);
  rpc DeleteStorage (DeleteStorageRequest) returns (DeleteStorageResponse);
  // Lists the plugin's live keys starting with `prefix`, sorted.
  rpc ListStorage (ListStorageRequest) returns (ListStorageResponse);
  // Liveness probe answered by the core itself, without touching the pipeline.
  //
  // Hosts use it to notice that the core they registered with has exited: a host whose core is
  // gone must stop, otherwise it keeps serving its platform (and, for adapters, keeps the
  // platform's long-lived connection) while no bot instance can answer — which shows up as a
  // ghost bot double-handling messages.
  rpc Ping (PingRequest) returns (PingResponse);
  // Reads the model conversation an inbound message belongs to. Read-only: history is
  // append-only and only the core writes it. NOT_FOUND when no enabled instance claims the
  // platform, UNAVAILABLE when no model is configured, INVALID_ARGUMENT without a context.
  rpc GetConversationHistory (ConversationHistoryRequest) returns (ConversationHistoryResponse);

  // --- Conversations: the sessions of one chat, as `/ls`, `/new`, `/switch` and `/del` see them.
  // Every call names the chat by an inbound message (`context`), resolved exactly as when the
  // core answers that message. NOT_FOUND when no enabled instance claims it.
  rpc ListConversations (ConversationsRequest) returns (ConversationList);
  // Starts a new, empty conversation and makes it current (what `/new` does).
  rpc NewConversation (ConversationsRequest) returns (ConversationList);
  // Makes another conversation of the same chat current. NOT_FOUND for an unknown session.
  rpc SwitchConversation (SelectConversationRequest) returns (ConversationList);
  // Deletes a conversation's history and records. Deleting the current one leaves the chat on a
  // new, empty conversation. NOT_FOUND for an unknown session.
  rpc DeleteConversation (SelectConversationRequest) returns (ConversationList);
  // Appends finished turns to the current conversation, e.g. a command exchange the model should
  // remember. Messages must alternate user/assistant, starting with user and ending with
  // assistant; anything else is INVALID_ARGUMENT. Append-only: nothing already stored changes.
  rpc AppendConversation (AppendConversationRequest) returns (AppendConversationResponse);

  // --- Personas: the operator's persona catalog (`data/personas.json`).
  rpc ListPersonas (ListPersonasRequest) returns (ListPersonasResponse);
  // Creates or replaces a persona. INVALID_ARGUMENT for an empty id or prompt, FAILED_PRECONDITION
  // for the built-in read-only persona.
  rpc UpsertPersona (Persona) returns (UpsertPersonaResponse);
  rpc DeletePersona (DeletePersonaRequest) returns (DeletePersonaResponse);

  // Runs the node's agent (model + tool loop) for a plugin and returns its final answer. Unlike
  // `RequestLLM` it can use tools and can run inside a chat's conversation. UNAVAILABLE when no
  // model is configured, NOT_FOUND when `context` names a chat no enabled instance claims.
  rpc RunAgent (RunAgentRequest) returns (RunAgentResponse);

  // Asks the core to fetch this host's `GetPluginMeta` again, so tools, commands and triggers a
  // plugin added or removed at runtime take effect for the next turn. NOT_FOUND for an unknown
  // host.
  rpc RefreshPluginMeta (RefreshPluginMetaRequest) returns (RefreshPluginMetaResponse);

  // Renders text (or SVG) into a PNG in the plugin's data directory, for sending as an image.
  // INVALID_ARGUMENT for empty input or malformed SVG; UNAVAILABLE when no usable font exists.
  rpc RenderImage (RenderImageRequest) returns (RenderImageResponse);
}

// --- 握手与注册 ---

message RegisterHostRequest {
  string host_id = 1;
  string runtime = 2; // "rust", "python", "typescript"
  string endpoint = 3; // Host 监听的专属 socket 路径或 loopback 地址
  repeated string loaded_plugin_ids = 4;
}

message RegisterHostResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Struct core_metadata = 3;
}

message PingRequest {
  int64 timestamp = 1;
}

message PingResponse {
  int64 timestamp = 1;
}

message ReloadPluginConfigRequest {
  string plugin_id = 1;
  google.protobuf.Struct config = 2;
  uint64 version = 3;
}

message ReloadPluginConfigResponse {
  bool success = 1;
  string error_message = 2;
  uint64 applied_version = 3;
}

message GetPluginMetaRequest {}

// Who may run a command (or fire a trigger) when the operator's command policy does not name it.
//
// The operator's policy always wins; this is only the plugin's default, so a plugin can declare
// that a destructive command is for administrators without the operator having to know about it.
enum CommandAccess {
  COMMAND_ACCESS_EVERYONE = 0;
  // Anyone in a private chat; only administrators in groups and channels.
  COMMAND_ACCESS_ADMINS_IN_GROUPS = 1;
  COMMAND_ACCESS_ADMINS = 2;
}

// Kind of conversation a message came from, as reported in `kanon.conversation_kind`.
enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_PRIVATE = 1;
  CONVERSATION_KIND_GROUP = 2;
  CONVERSATION_KIND_CHANNEL = 3;
}

message CommandMeta {
  string name = 1;
  string description = 2;
  string usage = 3;
  int32 priority = 4;
  // Alternative names routed to the same handler; the handler always receives `name`.
  repeated string aliases = 5;
  CommandAccess access = 6;
  // Platforms the command answers on; empty means every platform. Elsewhere the command does not
  // exist: another plugin's command of the same name may answer instead.
  repeated string platforms = 7;
  // Conversation kinds the command answers in; empty means every kind. Same effect as `platforms`.
  repeated ConversationKind conversation_kinds = 8;
  // Subcommands of a command group (`/<name> <sub> ...`), for help listings only: the core still
  // routes the whole command to `name` with the subcommand as the first argument, and the SDK
  // dispatches on it.
  repeated CommandMeta subcommands = 9;
}

// A message pattern that runs a plugin handler without a slash command.
//
// Triggers are matched after slash commands and before the reply policy and the model, against
// the message text with leading @-mentions removed. The first matching trigger (lowest priority
// value) handles the message through OnExecuteCommand: `command` is the trigger name, `args` are
// the capture groups (an unmatched group is an empty string) and `raw_args` is the whole text.
// A trigger the sender may not fire is skipped silently, since nobody typed a command.
message TriggerMeta {
  string name = 1;
  string description = 2;
  // Regular expression in Rust `regex` syntax; an invalid pattern never matches and is logged.
  string pattern = 3;
  int32 priority = 4;
  CommandAccess access = 5;
  // As for `CommandMeta`: a trigger outside these platforms or conversation kinds never matches.
  repeated string platforms = 6;
  repeated ConversationKind conversation_kinds = 7;
}

message ToolMeta {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
}

message PluginMeta {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string description = 5;
  repeated CommandMeta commands = 6;
  repeated ToolMeta tools = 7;
  repeated TriggerMeta triggers = 8;
  // Lifecycle events this plugin wants through `OnEvent`; nothing is sent for unlisted kinds.
  repeated EventKind events = 9;
  // Whether `OnDecorateReply` should be called for this plugin.
  bool decorates_replies = 10;
  // Whether `OnPrepareTurn` should be called for this plugin.
  bool prepares_turns = 11;
  // Whether `OnLlmRequest` should be called for this plugin.
  bool rewrites_system_prompt = 12;
  // Whether HTTP requests under `/api/v1/plugins/<id>/http/` are forwarded to `OnHttpRequest`.
  bool serves_http = 13;
}

message GetPluginMetaResponse {
  repeated PluginMeta plugins = 1;
}

// --- 强类型消息段定义 (彻底废弃 map<string, string> 反模式) ---

message PipelineEventRequest {
  string event_id = 1;
  string platform = 2;
  string channel_id = 3;
  string sender_id = 4;
  string raw_text = 5;
  repeated MessageSegment segments = 6;
  google.protobuf.Struct metadata = 7;
}

message MessageSegment {
  oneof segment {
    TextSegment text = 1;
    ImageSegment image = 2;
    AudioSegment audio = 3;
    MentionSegment mention = 4;
    ReplySegment reply = 5;
    RawCustomSegment custom = 6;
    VideoSegment video = 7;
    FileSegment file = 8;
    FaceSegment face = 9;
  }
}

message TextSegment {
  string content = 1;
}

message ImageSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  optional string mime_type = 4;
  optional string filename = 5;
}

message AudioSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  optional int32 duration_seconds = 4;
}

// Video, file and face segments are how plugins *send* these kinds on any platform. Received
// ones keep the platform's own custom segment (e.g. `milky.video`), which carries ids a URL
// cannot replace.
message VideoSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  optional string mime_type = 4;
  optional string filename = 5;
}

message FileSegment {
  oneof source {
    string url = 1;
    string file_path = 2;
    bytes raw_bytes = 3;
  }
  // Name shown to the recipient; required.
  string name = 4;
}

// A platform's built-in emoji (QQ face id).
message FaceSegment {
  string id = 1;
}

message MentionSegment {
  string target_user_id = 1;
  string display_name = 2;
  bool is_all = 3;
}

message ReplySegment {
  string target_message_id = 1;
  string snippet = 2;
}

message RawCustomSegment {
  string type_name = 1;
  google.protobuf.Struct payload = 2;
}

// --- 流水线与指令定义 ---

message PreFilterResult {
  enum Action {
    PASS = 0;
    BLOCK = 1;
    MODIFY = 2;
  }
  Action action = 1;
  string modified_text = 2;
  repeated MessageSegment reply_messages = 3;
}

message CommandExecuteRequest {
  string plugin_id = 1;
  // Canonical command name (never an alias), or the trigger name.
  string command = 2;
  // Arguments split on whitespace; quoted text ("a b", 'a b', “a b”) stays one argument.
  repeated string args = 3;
  PipelineEventRequest context = 4;
  // Everything after the command name, unsplit, for handlers that parse their own syntax.
  string raw_args = 5;
  // Set when this is the sender's next message, routed here because the previous response for
  // `command` asked to capture the conversation. `args` and `raw_args` then hold the whole
  // message text (leading @-mentions removed) and `context` the new event.
  bool continuation = 6;
}

message CommandExecuteResponse {
  bool success = 1;
  repeated MessageSegment replies = 2;
  string error_message = 3;
  // When non-zero, the next message from the same sender in the same channel (within this many
  // seconds, at most 600) skips commands, triggers and the model and is delivered to this plugin
  // as a continuation of `command`. One capture covers one message; answer a continuation with
  // `capture_seconds` again to keep the conversation. Pre-filters still see the message first.
  uint32 capture_seconds = 4;
  // When true the message continues to the model after this handler, as if no command or
  // trigger had matched: `replies` are delivered first, then the reply policy and the model
  // decide whether the bot answers. Ignored when `capture_seconds` is set: a plugin waiting for
  // the next message has not handed this one on.
  bool pass_to_model = 5;
  // With `pass_to_model`, replaces the message text the model reads (images are kept).
  optional string model_text = 6;
}

// --- Tool Calling 双模载荷定义 (彻底消灭 JSON 字符串二次序列化) ---

message ToolCallRequest {
  string call_id = 1;
  string tool_name = 2;
  string session_id = 3;
  oneof payload {
    google.protobuf.Struct structured_args = 4;
    bytes raw_bytes = 5;
  }
  // The inbound event whose conversation turn invoked the tool: who asked, where, on which
  // platform. Absent when the model runs outside a platform conversation (the console chat).
  PipelineEventRequest context = 6;
}

message ToolCallResponse {
  string call_id = 1;
  bool success = 2;
  string error_message = 3;
  oneof payload {
    google.protobuf.Struct structured_result = 4;
    bytes raw_bytes = 5;
  }
  // Rich media produced by the tool (images, files). The core forwards these to the outbound
  // message as attachments, so a tool that draws a picture is not reduced to a text description.
  repeated ToolAttachment attachments = 6;
}

// One attachment produced by a tool call.
message ToolAttachment {
  // MIME type of the payload, e.g. `image/png`.
  string mime_type = 1;
  // Absolute path of a file the core wrote the bytes to.
  optional string file_path = 2;
  // Remote URL, when the tool referenced one instead of embedding bytes.
  optional string url = 3;
}

// Lifecycle events a plugin can subscribe to.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // The bot delivered a message (any source: model, command, plugin `SendMessage`).
  EVENT_KIND_MESSAGE_SENT = 1;
  // A platform notice (join, poke, recall, friend request, ...) arrived.
  EVENT_KIND_NOTICE = 2;
  // The model answered a conversational message.
  EVENT_KIND_LLM_RESPONSE = 3;
  // The agent started answering a conversational message.
  EVENT_KIND_AGENT_BEGIN = 4;
  // The agent finished a turn, with an answer or an error.
  EVENT_KIND_AGENT_DONE = 5;
  // The model asked for a tool call (sent before the tool runs; observation only).
  EVENT_KIND_TOOL_CALL = 6;
  // A tool call finished.
  EVENT_KIND_TOOL_RESULT = 7;
}

// One lifecycle event, addressed to one subscribing plugin. The set `detail` is the event kind.
message EventNotification {
  reserved 1, 2;
  reserved "event_type", "payload";
  string plugin_id = 3;
  oneof detail {
    MessageSentEvent message_sent = 4;
    // The notice exactly as the adapter reported it (kind in `metadata`, see `META_NOTICE`).
    PipelineEventRequest notice = 5;
    LlmResponseEvent llm_response = 6;
    AgentBeginEvent agent_begin = 7;
    AgentDoneEvent agent_done = 8;
    ToolCallEvent tool_call = 9;
    ToolResultEvent tool_result = 10;
  }
}

message MessageSentEvent {
  DeliverMessageRequest message = 1;
  // Platform message id reported by the adapter, empty when it reports none.
  string message_id = 2;
}

message LlmResponseEvent {
  // The message the model answered.
  PipelineEventRequest context = 1;
  // The model's final text, before reply decoration.
  string content = 2;
}

message AgentBeginEvent {
  // The message the agent is answering.
  PipelineEventRequest context = 1;
  string session_id = 2;
}

message AgentDoneEvent {
  PipelineEventRequest context = 1;
  string session_id = 2;
  bool success = 3;
  // The final answer when `success`, before reply decoration.
  string content = 4;
  // Why the turn ended without an answer (failure category, or "stopped"), when not `success`.
  string error = 5;
  // Tools the turn called, in order.
  repeated string tools = 6;
}

message ToolCallEvent {
  // The message whose turn called the tool; absent outside a platform conversation.
  PipelineEventRequest context = 1;
  string session_id = 2;
  // The name the model used (namespaced as `<plugin>__<tool>` when names collide).
  string tool_name = 3;
  google.protobuf.Struct arguments = 4;
}

message ToolResultEvent {
  PipelineEventRequest context = 1;
  string session_id = 2;
  string tool_name = 3;
  bool success = 4;
  // The result text the model reads.
  string result = 5;
}

// Where a decorated reply came from.
enum ReplySource {
  REPLY_SOURCE_UNSPECIFIED = 0;
  REPLY_SOURCE_LLM = 1;
  REPLY_SOURCE_COMMAND = 2;
}

message DecorateReplyRequest {
  string plugin_id = 1;
  // The inbound message being answered.
  PipelineEventRequest context = 2;
  repeated MessageSegment segments = 3;
  ReplySource source = 4;
  // Command or trigger name for `REPLY_SOURCE_COMMAND`, empty otherwise.
  string command = 5;
}

message DecorateReplyResult {
  // When false the reply is left untouched and `segments` is ignored. When true `segments`
  // replaces the reply; an empty list suppresses it.
  bool modified = 1;
  repeated MessageSegment segments = 2;
}

message PrepareTurnRequest {
  string plugin_id = 1;
  // The inbound message the model is about to answer, after pre-filters.
  PipelineEventRequest context = 2;
  // Identifier of the model conversation, stable until `/new`; useful as a memory key.
  string session_id = 3;
}

message PrepareTurnResult {
  // Text prepended to the current user message; empty adds nothing. It becomes part of the
  // turn and therefore of the conversation history, like everything the model reads.
  string text = 1;
}

message LlmRequestHookRequest {
  string plugin_id = 1;
  // The inbound message the model is about to answer.
  PipelineEventRequest context = 2;
  string session_id = 3;
  // The system prompt as built so far (instance prompt or persona, skill catalog, and earlier
  // plugins' rewrites).
  string system_prompt = 4;
}

message LlmRequestHookResult {
  // Replaces the system prompt when set; unset leaves it unchanged. An empty string is rejected
  // (the prompt is left unchanged and the plugin is logged).
  optional string system_prompt = 1;
}

message HttpHeader {
  string name = 1;
  string value = 2;
}

message HttpRequest {
  string plugin_id = 1;
  // Upper-case method, e.g. "GET".
  string method = 2;
  // Path below the plugin's route root, starting with "/" ("/" for the root itself).
  string path = 3;
  // Raw query string without the leading "?", empty when absent.
  string query = 4;
  repeated HttpHeader headers = 5;
  bytes body = 6;
}

message HttpResponse {
  // HTTP status; 0 is treated as 200.
  uint32 status = 1;
  repeated HttpHeader headers = 2;
  bytes body = 3;
}

message EventAck {
  bool received = 1;
}

message DeliverMessageRequest {
  string platform = 1;
  string channel_id = 2;
  string recipient_id = 3;
  repeated MessageSegment segments = 4;
  string event_id = 5;
}

message DeliverMessageResponse {
  bool success = 1;
  string message_id = 2;
  string error_message = 3;
}

message IngestEventRequest {
  string platform = 1;
  PipelineEventRequest event = 2;
}

message IngestEventResponse {
  bool accepted = 1;
  string event_id = 2;
}

message PlatformApiRequest {
  string platform = 1;
  // Platform action name: letters, digits, `_` and `.` only.
  string action = 2;
  google.protobuf.Struct params = 3;
}

message PlatformApiResponse {
  // The action's result as the platform returned it; `null` when it returned nothing.
  google.protobuf.Value result = 1;
}

message SendMessageRequest {
  string platform = 1;
  string channel_id = 2;
  string recipient_id = 3;
  repeated MessageSegment segments = 4;
}

message SendMessageResponse {
  // Whether the outbound message was accepted into the outbound dispatch queue.
  // Delivery to the external platform is asynchronous and subject to platform breakers and DLQ.
  bool success = 1;
  // Internal tracking ID assigned to this queued outbound message.
  string message_id = 2;
  // Rejection explanation if queue admission failed.
  string error_message = 3;
  // Explicit admission flag confirming the message is queued for outbound dispatch.
  bool accepted = 4;
}

enum LLMRole {
  LLM_ROLE_UNSPECIFIED = 0;
  LLM_ROLE_USER = 1;
  LLM_ROLE_ASSISTANT = 2;
}

// One turn of a plugin's own conversation with the model.
message LLMMessage {
  LLMRole role = 1;
  string text = 2;
  // Images for the model to look at; user turns only. Any source is accepted: URL, file path, or
  // raw bytes (with `mime_type`).
  repeated ImageSegment images = 3;
}

// A one-off model call on the node's provider. It never touches any conversation's memory.
message LLMRequest {
  reserved 1, 3;
  reserved "prompt", "parameters";
  // Empty uses the node's default model.
  string model = 2;
  string system_prompt = 4;
  // Oldest first; must not be empty.
  repeated LLMMessage messages = 5;
  optional float temperature = 6;
  optional uint32 max_tokens = 7;
}

message LLMChunk {
  string delta_text = 1;
  bool is_finished = 2;
}

message SetStorageRequest {
  string plugin_id = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_seconds = 4;
}

message SetStorageResponse {
  bool success = 1;
}

message GetStorageRequest {
  string plugin_id = 1;
  string key = 2;
}

message GetStorageResponse {
  bool found = 1;
  bytes value = 2;
}

message DeleteStorageRequest {
  string plugin_id = 1;
  string key = 2;
}

message DeleteStorageResponse {
  // Whether a live key was removed.
  bool deleted = 1;
}

message ListStorageRequest {
  string plugin_id = 1;
  string prefix = 2;
}

message ListStorageResponse {
  repeated string keys = 1;
}

message ConversationHistoryRequest {
  // The inbound message whose conversation is read; the core derives the session exactly as it
  // does when answering that message.
  PipelineEventRequest context = 1;
  // Most recent messages to return; 0 returns all of them.
  uint32 limit = 2;
}

// One user or assistant turn of a model conversation. Tool calls and tool results are omitted,
// and the model's reasoning is stripped from assistant text.
message HistoryMessage {
  LLMRole role = 1;
  string text = 2;
}

message ConversationHistoryResponse {
  string session_id = 1;
  // Summary of compacted older turns; empty when the conversation was never compacted.
  string summary = 2;
  // Oldest first.
  repeated HistoryMessage messages = 3;
}

message ConversationsRequest {
  // An inbound message of the chat whose conversations are meant.
  PipelineEventRequest context = 1;
}

message SelectConversationRequest {
  PipelineEventRequest context = 1;
  // `ConversationInfo.session_id` of the conversation to act on.
  string session_id = 2;
}

message ConversationInfo {
  string session_id = 1;
  // Whether the chat's next message continues this conversation.
  bool current = 2;
  // First user message, shortened; empty for a conversation without messages.
  string title = 3;
  // User and assistant messages stored (summarized ones excluded).
  uint32 message_count = 4;
  // Unix seconds of the last turn; 0 when it never had one.
  int64 last_active_at = 5;
}

message ConversationList {
  // Oldest first; `/ls` numbers them from 1 in this order.
  repeated ConversationInfo conversations = 1;
}

message AppendConversationRequest {
  PipelineEventRequest context = 1;
  repeated HistoryMessage messages = 2;
}

message AppendConversationResponse {
  string session_id = 1;
}

message Persona {
  string id = 1;
  string name = 2;
  // The fixed system text placed at the top of every request of a conversation using it.
  string prompt = 3;
  // Whether the persona ships with the node and cannot be changed or deleted.
  bool builtin = 4;
}

message ListPersonasRequest {}

message ListPersonasResponse {
  repeated Persona personas = 1;
}

message UpsertPersonaResponse {
  // Whether an existing persona was replaced (false: created).
  bool replaced = 1;
}

message DeletePersonaRequest {
  string id = 1;
}

message DeletePersonaResponse {
  bool deleted = 1;
}

message RunAgentRequest {
  string plugin_id = 1;
  // The user message for the agent; must not be empty unless `images` are given.
  string prompt = 2;
  repeated ImageSegment images = 3;
  // The chat the run serves. Sets the instance (its model, tools and policies) and is passed to
  // tools as their context. Optional unless `in_conversation` is set.
  PipelineEventRequest context = 4;
  // Run inside the chat's current conversation: the turn is answered with the conversation's
  // history and persona and appended to it, exactly as if the model had answered the message.
  // When false the run uses a fresh, private session that is discarded afterwards.
  bool in_conversation = 5;
  // Instructions for a private run; ignored in a conversation, whose system prompt is fixed.
  string system_prompt = 6;
  // `<provider>/<model-id>`; empty uses the instance's model, else the node's default model.
  string model = 7;
  // Whether the agent may call tools (those the instance allows: plugins, MCP, built-in).
  bool use_tools = 8;
  // Tool rounds allowed; 0 uses the agent's default.
  uint32 max_steps = 9;
}

message RunAgentResponse {
  // Final answer, with reasoning removed.
  string content = 1;
  repeated ToolAttachment attachments = 2;
  // Tools called, in order.
  repeated string tools = 3;
  // The session the run used (the conversation's, or the discarded private one).
  string session_id = 4;
}

message RefreshPluginMetaRequest {
  string host_id = 1;
}

message RefreshPluginMetaResponse {
  // Plugins whose metadata the core now holds.
  repeated string plugin_ids = 1;
}

message RenderImageRequest {
  string plugin_id = 1;
  oneof source {
    // Plain text laid out as a card: wrapped to `width`, blank lines separate paragraphs, a line
    // starting with "# " is a heading. CJK and emoji render with the system's fonts.
    string text = 2;
    // A complete SVG document, rendered as is.
    string svg = 3;
  }
  // Output width in pixels for text (default 720, 200..=2000); SVG keeps its own size.
  uint32 width = 4;
}

message RenderImageResponse {
  // Absolute path of the PNG under `data/plugins/<plugin_id>/render/`.
  string file_path = 1;
  uint32 width = 2;
  uint32 height = 3;
}

[package]
name = "demo-rust-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
kanon-sdk = { path = "../../kanon-sdk" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Derives the schema of typed tool arguments; same major version as the SDK.
schemars = "1"

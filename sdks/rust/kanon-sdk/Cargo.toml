[package]
name = "kanon-sdk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Official Rust SDK for developing Kanon plugins and adapters"

[dependencies]
kanon-proto = { path = "../../../crates/kanon-proto" }
kanon-transport = { path = "../../../crates/kanon-transport" }
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
prost-types = "0.13"

[dev-dependencies]
tokio-stream = "0.1"

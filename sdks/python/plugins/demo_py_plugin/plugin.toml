[plugin]
id = "org.kanon.plugin.demo_py"
name = "Demo Python Plugin"
version = "0.1.0"
author = "Kanon Dev"
description = "Demonstration plugin written in Python"
runtime = "python"
entrypoint = "main.py"
isolated = false
priority = 100

[[commands]]
name = "pycalc"
description = "Python-based calculation command"
usage = "/pycalc <expr>"
priority = 100

[[commands]]
name = "note"
usage = "/note add <text> | /note list"

[[commands]]
name = "rules"
description = "Set extra instructions for the assistant in this chat"
usage = "/rules [text]"

[[tools]]
name = "py_calc"
description = "Python mathematical calculation tool"
parameters = { type = "object", properties = { expr = { type = "string", description = "Expression to evaluate" } } }

[[tools]]
name = "dice"
description = "Rolls dice for the user."

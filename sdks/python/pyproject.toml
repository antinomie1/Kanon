[project]
name = "kanon-python-host"
version = "0.1.0"
description = "Official Python Host and SDK skeleton for Kanon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution name differs from the import packages, so hatchling must be told what to ship.
# Plugins depend on this package so the SDK's own requirements land in each plugin's `.venv`.
[tool.hatch.build.targets.wheel]
packages = ["kanon_sdk", "kanon_host"]

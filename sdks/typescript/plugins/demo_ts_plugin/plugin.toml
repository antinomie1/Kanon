[plugin]
id = "org.kanon.plugin.demo_ts"
name = "Demo TypeScript Plugin"
version = "0.1.0"
author = "Kanon Dev"
description = "Demonstration plugin written in TypeScript"
runtime = "typescript"
entrypoint = "index.ts"
isolated = false
priority = 100

[[commands]]
name = "tsgreet"
description = "TypeScript-based greeting command"
usage = "/tsgreet <name>"
priority = 100

[[commands]]
name = "note"
usage = "/note add <text> | /note list"

[[commands]]
name = "rules"
description = "Set extra instructions for the assistant in this chat"
usage = "/rules [text]"

[[tools]]
name = "ts_calc"
description = "TypeScript mathematical calculation tool"
parameters = { type = "object", properties = { expr = { type = "string", description = "Expression to evaluate" } } }

[[tools]]
name = "dice"
description = "Rolls dice for the user."

[package]
name = "kanon-dev"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "CLI tool for Kanon plugin project management, scaffolding, and testing"

[features]
default = []
dsh = ["kanon-core/dsh", "kanon-llm/dsh"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
kanon-core = { path = "../kanon-core" }
kanon-llm = { path = "../kanon-llm" }
kanon-proto = { path = "../kanon-proto" }
kanon-storage = { path = "../kanon-storage" }
ring = "0.17"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tonic = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
tempfile = "3.12"

[package]
name = "kanon-adapter-milky"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Milky protocol platform adapter for the Kanon microkernel"

[dependencies]
kanon-core = { path = "../kanon-core" }
kanon-proto = { path = "../kanon-proto" }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }

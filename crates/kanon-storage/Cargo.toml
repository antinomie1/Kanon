[package]
name = "kanon-storage"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Storage engine and data directory manager for Kanon"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.12"

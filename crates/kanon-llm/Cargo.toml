[package]
name = "kanon-llm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "LLM gateway, context memory manager, and tool calling router for Kanon"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
prost-types = "0.13"
tonic = "0.12"
async-trait = "0.1"
dashmap = "6.1"
tokio-stream = "0.1"
futures-core = "0.3"
kanon-proto = { path = "../kanon-proto" }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3.12"


[package]
name = "kanon-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Microkernel engine, pipeline router, and process supervisor for Kanon"

[dependencies]
kanon-proto = { path = "../kanon-proto" }
kanon-transport = { path = "../kanon-transport" }
kanon-storage = { path = "../kanon-storage" }
kanon-llm = { path = "../kanon-llm" }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tracing-subscriber = "0.3"
bollard = { version = "0.20", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.12"
axum = "0.7"

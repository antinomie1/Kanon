[package]
name = "kanon-adapter-onebot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "OneBot v11 WebSocket platform adapter for Kanon"

[dependencies]
kanon-core = { path = "../kanon-core" }
kanon-proto = { path = "../kanon-proto" }
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util"] }

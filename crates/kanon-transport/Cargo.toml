[package]
name = "kanon-transport"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform IPC transport abstraction (UDS and authenticated loopback) for Kanon"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
tower = { version = "0.4", default-features = false, features = ["util"] }
futures-core = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
constant_time_eq = "0.3"
thiserror = "1.0"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"

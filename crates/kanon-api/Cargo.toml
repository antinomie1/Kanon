[package]
name = "kanon-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Decoupled RESTful API and WebSocket gateway for Kanon"

[dependencies]
kanon-core = { path = "../kanon-core" }
kanon-adapter-milky = { path = "../kanon-adapter-milky" }
kanon-adapter-onebot = { path = "../kanon-adapter-onebot" }
kanon-adapter-qqofficial = { path = "../kanon-adapter-qqofficial" }
kanon-llm = { path = "../kanon-llm" }
kanon-proto = { path = "../kanon-proto" }
kanon-storage = { path = "../kanon-storage" }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "1.0"
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
base64 = "0.22"
tempfile = "3.12"
semver = "1"

[dev-dependencies]
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
tempfile = "3.12"
toml = "0.8"
kanon-transport = { path = "../kanon-transport" }

[plugin]
id = "org.kanon.adapter.qqofficial"
name = "QQ Official Adapter"
version = "0.2.0"
author = "Kanon Dev"
description = "Comprehensive QQ Official platform adapter for Kanon"
runtime = "python"
entrypoint = "main.py"
isolated = true
priority = 100

[adapter]
platform = "qqofficial"
display_name = "QQ 官方机器人"

[config_schema]
type = "object"
properties = { appid = { type = "string", description = "QQ 机器人 AppID" }, secret = { type = "string", description = "QQ 机器人 Secret" }, is_sandbox = { type = "boolean", default = false, description = "是否连接沙箱环境" }, enable_group_c2c = { type = "boolean", default = true, description = "启用群聊和私聊意图 (Group & C2C)" }, enable_guild_direct_message = { type = "boolean", default = false, description = "启用频道私信意图" }, use_markdown = { type = "boolean", default = true, description = "默认发送 Markdown 消息（遇权限限制自动回退纯文本）" }, markdown_template_id = { type = "string", description = "QQ 官方 Markdown 模板 ID（可选）" }, markdown_params_key = { type = "string", default = "text_content", description = "Markdown 模板参数 Key" }, qqofficial_bind_host = { type = "string", default = "q.qq.com", description = "QQ 开放平台快捷扫码域名" } }
required = ["appid", "secret"]
